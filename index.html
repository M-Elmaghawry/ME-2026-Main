<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png?v=2" />
    <!-- PAGE_SEO_START --><!-- PAGE_SEO_END -->
  </head>

  <body>
    <script>
      // Restore a direct page visit redirected by the generated 404.html.
      (function() {
        var route = new URLSearchParams(location.search).get('__spa');
        if (route) {
          var target = new URL(route, location.origin);
          if (route.startsWith('%BASE_URL%') && target.origin === location.origin &&
              target.pathname.startsWith('%BASE_URL%')) {
            window.history.replaceState(null, null, target.pathname + target.search + target.hash);
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
